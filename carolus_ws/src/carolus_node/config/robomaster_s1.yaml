# Carolus configuration profile — DJI RoboMaster S1 (this project's robot)
#
# Everything in this file is specific to ONE physical robot and ONE physical
# beacon. To run Carolus on different hardware, copy this file, replace the
# values below with your own measurements, and pass it to carolus.launch:
#
#     roslaunch carolus_node carolus.launch \
#         config:=$(rospack find carolus_node)/config/my_robot.yaml \
#         camera_topic:=/my/camera/image_raw
#
# Nothing else in the Carolus source needs changing — the detection and P4P
# solver are camera- and robot-agnostic.

# --- Camera intrinsics -------------------------------------------------------
# MEASURE THESE FOR YOUR OWN CAMERA. Values below come from
# robomaster_cam/config/camera_info.yaml (camera_name: robomaster_s1,
# 1280x720), validated pragmatically rather than by a formal calibration
# campaign. See the technical manual's calibration chapter for the procedure.
fx: 546.1957
fy: 547.0838
cx: 575.6041
cy: 372.1876

# plumb_bob distortion: k1 k2 p1 p2. FOUR values, as a real YAML list -- see
# BUG-117 (2026-08-17). This used to be a quoted STRING with five values
# (including k3), which two things silently defeated at once: getParam into a
# std::vector<double> requires a YAML sequence, not a string, so it failed and
# left the vector empty; and carolus_astrobee.cpp:352 builds the actual
# distortion cv::Mat from exactly indices [0..3] regardless of vector length,
# so k3 could never have been used even with the type fixed. Net effect: this
# robot's own measured distortion has never been applied. Carolus has been
# silently using the hardcoded Astrobee "wannabee" placeholder instead
# ({-0.092775, 0.014312, 0.000103, 0.000220}) for every pose it has ever
# published on this robot. k3 is dropped here, not rounded away -- the code
# has no path that could consume a 5th coefficient.
distortion: [-0.1479, 0.1452, -0.0023, 0.0025]

# --- Beacon geometry ---------------------------------------------------------
# MEASURE THIS FOR YOUR OWN BEACON. Four LED positions in metres, in Carolus's
# own (left-handed) frame. One point is deliberately off the plane of the other
# three — this is required for P4P to resolve pose unambiguously, so keep that
# property if you build a different beacon.
known_points: "0.0825 0.0 0.0 -0.0825 0.0 0.0 0.0 0.072 0.0 0.0 0.0 0.0555"

# --- Blob detection ----------------------------------------------------------
# Tune these against /postprocessed/image for your own LEDs and lighting.
min_circularity: 0.6
saturation_threshold: 80
# min_area was lowered 8.0 -> 0.4 on 2026-08-14 for Hector's 8m detection-range
# requirement, then REVERTED back to 8.0 the same week: 0.4 raised P4P
# combinatorial ambiguity from 3.6% to well over half the frames at normal
# (~1m) working distance -- a low area floor admits enough noise/reflection
# contours into the 4-blob candidate search that selectBlobs() starts picking
# wrong groups. 8.0 is the value validated by 1.4b (2026-08-17), at short
# range, where this robot has actually been operated and measured.
#
# The 8m requirement is real and still open, but a single global threshold
# cannot serve both regimes -- see robomaster_s1_longrange.yaml, a SIBLING
# profile (not a replacement for this one) carrying the low-area value for
# long-range sessions. Do not lower min_area here again without re-deriving
# the same close-range ambiguity check this revert was based on.
min_area: 8.0
max_area: 1800.0
max_distance_lim: 1000.0

# Hue window, in OpenCV's 0-180 scale (NOT 0-360). The node compares the blob's
# mean hue against these bounds on that same 0-180 scale, so a value taken from
# the 0-360 convention silently rejects every blob and no pose is ever
# published. Reference: red ~0-10 and ~170-180, green ~50-80, blue ~100-140.
# This robot uses blue LEDs.
lb_hue: 90.0
ub_hue: 140.0

# --- Preprocessing -----------------------------------------------------------
kernel_size_gaussian: 3
kernel_size_morph: 3
image_threshold: 190

# --- Outlier rejection (moving-window filter over successive poses) ----------
filter_size: 7
translation_threshold: 0.5
rotation_threshold: 0.3
fifo_on: true

# --- Execution ---------------------------------------------------------------
num_threads: 1
queue_size: 10
benchtest: true

# --- Camera selection (Astrobee-era flags, kept for compatibility) -----------
nav_cam: true
dock_cam: false
fisheye: false
fov: true
mono: false

# Legacy label inherited from the Astrobee simulation template this node came
# from. No functional effect; left as-is rather than renamed.
bot_name: "wannabee"
