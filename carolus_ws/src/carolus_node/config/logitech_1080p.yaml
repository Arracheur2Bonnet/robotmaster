# Carolus configuration profile — Logitech 1080p USB webcam, ground-station PC
#
# For Hector's separate build: Carolus + a Logitech 1080p webcam on a PC, no
# RoboMaster involved. See overleaf/technical.tex's calibration chapter for
# the general "copy this file for your own hardware" pattern -- this is that
# pattern applied.
#
# Camera intrinsics: from Hector directly, 2026-08-17 (his email). Approximate
# -- his own words: "The camera should be calibrated again later, after we
# get it to work". Treat as a starting point to confirm detection runs at
# all, not as a formally calibrated value.
fx: 570.6975
fy: 572.8081
cx: 322.6828
cy: 228.3519

# plumb_bob distortion: k1 k2 p1 p2. A real YAML list, not a quoted string --
# see BUG-117 (2026-08-17, journal.md): the string form silently fails to
# load as a vector<double> and the node falls back to a hardcoded Astrobee
# placeholder with no warning. carolus_astrobee.cpp:352 only ever consumes
# exactly 4 values regardless of list length, so don't add a 5th (k3).
distortion: [0.0223, -0.3088, -0.0048, -0.0018]

# --- Beacon geometry ---------------------------------------------------------
# Copied from robomaster_s1.yaml as a starting point, UNVERIFIED for
# whichever physical beacon is in front of this camera. If it is the same
# beacon this project uses on the RoboMaster, these are already correct
# (confirmed by ruler, see robomaster_s1.yaml's own history). If it is a
# different physical beacon, measure and replace before trusting any pose.
known_points: "0.0825 0.0 0.0 -0.0825 0.0 0.0 0.0 0.072 0.0 0.0 0.0 0.0555"

# --- Blob detection ----------------------------------------------------------
# Copied from robomaster_s1.yaml as a starting point. A different camera at a
# different resolution/FOV/exposure will very likely need these retuned
# against /postprocessed/image -- do not assume they carry over.
min_circularity: 0.6
saturation_threshold: 80
min_area: 8.0
max_area: 1800.0
max_distance_lim: 1000.0

# Hue window, OpenCV's 0-180 scale (NOT 0-360). Assumes the same blue LED
# beacon as the RoboMaster's. Re-check with the live meter
# (shortcuts/beacon_brightness_live.py) if detection fails -- a beacon that
# looks fine to the eye can still be outside this window under different
# camera white balance.
lb_hue: 90.0
ub_hue: 140.0

# --- Preprocessing -----------------------------------------------------------
kernel_size_gaussian: 3
kernel_size_morph: 3

# 100, NOT the RoboMaster profile's 190 -- see BUG-130 (2026-08-21). This file
# was created 2026-08-17 by copying robomaster_s1.yaml and replacing the
# intrinsics; image_threshold came along unexamined and was never checked
# against a webcam. It is the wrong value for a blue-LED beacon on this class
# of camera, and it fails silently: preprocessImage() does
#
#     cv::threshold(blurred, thresholded, image_threshold, 255, THRESH_BINARY)
#
# so at 190 the whole frame goes black, findContours() returns nothing,
# findAndCalcContours() logs "ERROR: 0 contours found" and returns nullopt.
# The node runs, the topic list looks healthy, and no pose is ever published.
#
# The cause is physical and NOT specific to one camera unit: a saturated blue
# pixel carries little weight in the standard 0.299R + 0.587G + 0.114B
# grayscale conversion, so blue LEDs that are unambiguously bright to the eye
# land low in grayscale. Measured on a Logitech C920 with the four-LED beacon
# lit and in frame (2026-08-20, lab PC; reconfirmed 2026-08-21, Raspberry Pi 5):
# hue 105-115 and saturation 200-255 -- both comfortably inside their windows --
# but grayscale topping out at 131, i.e. below 190. Moving the beacon closer
# with the threshold left at 190 still gave zero contours, which is what rules
# out blob size and distance and leaves the luminance ceiling.
#
# 100 sits comfortably below the measured 131 and above the ambient background.
# It is the value the ROS2 sibling of this file
# (raspberry5-carolus-ros2/carolus_ros2/config/logitech_1080p.yaml) has carried
# since 2026-08-20, verified on two machines.
#
# HONESTY MARKER: measured on THIS project's C920, not on the camera belonging
# to the person this profile was written for -- that is a different physical
# unit and its intrinsics here came from them, not from us. The mechanism is
# general, the exact ceiling is per-unit. If detection still fails, measure
# rather than guess: shortcuts/beacon_brightness_live.py reports the live
# grayscale peak, and image_threshold must sit below it.
image_threshold: 100

# --- Outlier rejection (moving-window filter over successive poses) ----------
filter_size: 7
translation_threshold: 0.5
rotation_threshold: 0.3
fifo_on: true

# --- Execution ---------------------------------------------------------------
num_threads: 1
queue_size: 10
benchtest: true

# --- Camera selection (Astrobee-era flags, kept for compatibility) -----------
nav_cam: true
dock_cam: false
fisheye: false
fov: true
mono: false

bot_name: "wannabee"
